  - id: Q07
    answer: >
      An order cannot be canceled when it is already completed (use returns instead), when it is already
      canceled, or when it has any fulfillment that is not canceled. Shipped fulfillments cannot be canceled
      at all, so an order with a shipped package cannot be canceled.
    citations: [packages/core/core-flows/src/order/workflows/cancel-order.ts:71-104, packages/core/core-flows/src/order/workflows/cancel-order-fulfillment.ts]
