  - id: Q04
    answer: >
      The shopper gets the same order back; Medusa never creates a duplicate. The cart is locked while it
      completes and an existing cart-to-order link short-circuits a second attempt.
    citations: [packages/core/core-flows/src/cart/workflows/complete-cart.ts:388-411]
    pages_used: [journeys/checkout.md]
    confidence: high
  - id: Q05
    answer: >
      Stock is checked when adding to cart (unless backorders are allowed or the variant does not track
      inventory). If it sells out later, the shopper finds out when placing the order: reserving stock fails,
      the order is deleted and payment is never attempted. They get a generic HTTP error, not the friendly
      cart-plus-error response used for payment failures.
    citations: [packages/core/core-flows/src/cart/steps/confirm-inventory.ts:76-97, packages/modules/inventory/src/services/inventory-module.ts, "packages/medusa/src/api/store/carts/[id]/complete/route.ts:37-43"]
    pages_used: [capabilities.md, journeys/checkout.md]
    confidence: high
  - id: Q06
    answer: >
      No order confirmation email is sent by default. Medusa emits an `order.placed` signal; a notification
      provider (for example SendGrid) plus a listener is needed to send email.
