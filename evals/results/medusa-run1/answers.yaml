  - id: Q01
    answer: >
      The checkout attempt fails but nothing is lost: the order that was just created is deleted,
      reserved stock is released and promo usage is reverted. The storefront gets an HTTP 200 response
      with `type: "cart"` and the error "Payment authorization failed", so the shopper stays on checkout.
    citations: [packages/core/core-flows/src/payment/steps/authorize-payment-session.ts:94-99, "packages/medusa/src/api/store/carts/[id]/complete/route.ts:37-73"]
    pages_used: [journeys/checkout.md]
    confidence: high
